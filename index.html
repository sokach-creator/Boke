<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sokach 的个人博客</title>
  <meta name="description" content="Sokach 的个人博客 —— 记录学习、生活与热爱。">
  <link rel="icon" type="image/png" href="assets/avatar.png">
  <link rel="stylesheet" href="css/style.css?v=20261017b">
</head>
<body>
  <!-- 顶部导航 -->
  <header id="nav">
    <a class="nav-avatar" href="#/home" title="回到首页">
      <img id="navAvatar" src="assets/avatar.png" alt="头像">
    </a>
    <nav class="nav-links" id="navLinks"></nav>
    <div class="nav-actions">
      <button class="nav-btn" id="searchBtn" title="搜索" aria-label="搜索"></button>
      <button class="nav-btn" id="themeBtn" title="切换暗色模式" aria-label="切换暗色模式"></button>
      <button class="nav-btn nav-burger" id="burgerBtn" title="菜单" aria-label="菜单"></button>
    </div>
  </header>

  <!-- 移动端抽屉菜单 -->
  <div id="drawerMask"></div>
  <aside id="drawer"></aside>

  <!-- 页面主体（由路由渲染） -->
  <main id="app"></main>

  <!-- 页脚 -->
  <footer id="footer"></footer>

  <!-- 搜索弹窗 -->
  <div id="searchMask" class="modal-mask" hidden>
    <div class="search-box" role="dialog" aria-label="搜索文章">
      <div class="search-input-row">
        <span id="searchIcon"></span>
        <input id="searchInput" type="text" placeholder="输入关键词，回车或实时搜索…" autocomplete="off">
        <button id="searchClose" title="关闭（Esc）">ESC</button>
      </div>
      <div id="searchResults"></div>
    </div>
  </div>

  <!-- 图片灯箱 -->
  <div id="lightbox" hidden>
    <img id="lightboxImg" src="" alt="预览">
  </div>

  <!-- 回到顶部 -->
  <button id="backTop" title="回到顶部" aria-label="回到顶部"></button>

  <script src="js/data.js?v=20261017b"></script>
  <script src="js/admin.js?v=20261017b"></script>
  <script src="js/app.js?v=20261017b"></script>
</body>
</html>
